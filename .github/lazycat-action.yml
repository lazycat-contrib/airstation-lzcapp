version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: output/application.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: airstation

build:
  run_buildscript: false

images:
  - id: airstation
    target: service
    service: airstation
    source: docker.io/cheatsnake/airstation
    channel: stable
    sort: semver
    tag_regex: '^v?\d+\.\d+\.\d+$'
    version_regex: '^v?(?P<version>\d+\.\d+\.\d+)$'
    version_template: '{version}'
    delivery:
      mode: mirror
      image_template: docker.1ms.run/cheatsnake/airstation:{tag}
      require_digest_match: true

stores:
  official:
    enabled: false
    skip_if_version_exists: false
    retry:
      enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: Airstation
    summary: Published from GitHub Actions
